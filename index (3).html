<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Happy Birthday, Eshaal! 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:wght@500;600&family=Dancing+Script:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8b960;--gold2:#f6dc9b;--cream:#f7ecd6;--dim:#b9aa8c;--glow:rgba(232,185,96,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% -10%,#16275a,#070c1c 55%,#03050c),radial-gradient(circle at 20% 80%,rgba(255,107,138,.08) 0,transparent 40%),radial-gradient(circle at 80% 20%,rgba(232,185,96,.08) 0,transparent 40%) fixed;color:var(--cream);font:400 1.05rem/1.7 'Inter','Poppins',system-ui,sans-serif;overflow-x:hidden}
h1,h2,.ser{font-family:'Caveat','Dancing Script',cursive;font-weight:600;line-height:1.2}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 22px;position:relative}
.gold{background:linear-gradient(100deg,var(--gold) 25%,#fff3cf 47%,var(--gold) 70%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% center}}
.btn{font:600 1.05rem 'Inter','Poppins',sans-serif;color:#1a1204;background:linear-gradient(135deg,var(--gold2),var(--gold));border:0;border-radius:999px;padding:16px 38px;cursor:pointer;box-shadow:0 0 30px var(--glow);transition:all .4s cubic-bezier(.25,.4,.25,1);letter-spacing:.5px}
.btn:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.sp{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold2);box-shadow:0 0 8px 2px var(--glow);opacity:0;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.9;transform:translateY(-14px) scale(1.4)}}
.ht{position:absolute;bottom:-40px;animation:fl linear forwards}
@keyframes fl{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
main,#welcome{position:relative;z-index:2}
#welcome{transition:opacity .8s,transform .8s}
#welcome.go{opacity:0;transform:scale(1.08);pointer-events:none}
#welcome h1{font-size:clamp(1.8rem,7vw,2.8rem);max-width:14em;margin-bottom:36px;font-family:'Caveat','Dancing Script',cursive;font-weight:700;letter-spacing:.1em}
.gift{position:relative;width:130px;height:130px;margin-bottom:38px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 30px var(--glow))}
@keyframes bob{50%{transform:translateY(-12px)}}
.gift .b{position:absolute;bottom:0;left:8px;right:8px;height:82px;background:linear-gradient(160deg,#7a1523,#450a13);border-radius:6px}
.gift .l{position:absolute;bottom:80px;left:0;right:0;height:34px;background:linear-gradient(160deg,#951a2c,#5c0f1a);border-radius:6px;transform-origin:left bottom;transition:transform .8s}
.gift .r{position:absolute;bottom:0;left:calc(50% - 11px);width:22px;height:114px;background:linear-gradient(var(--gold2),var(--gold))}
.gift::before,.gift::after{content:"";position:absolute;bottom:112px;width:34px;height:26px;border:5px solid var(--gold);border-radius:50% 50% 0 50%;z-index:2}
.gift::before{left:calc(50% - 36px)}.gift::after{left:calc(50% + 2px);transform:scaleX(-1)}
#welcome.go .l{transform:rotate(-35deg) translateY(-14px)}
.rv{opacity:0}
.on .rv{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
main section{display:none}
main section.on{display:flex;animation:pg .7s ease both}
@keyframes pg{from{opacity:0;transform:scale(.97)}}
.nx{margin-top:34px}
/* hero */
.ring{width:min(80vw,320px);aspect-ratio:1;border-radius:50%;padding:5px;background:conic-gradient(var(--gold),#fff3cf,var(--gold),#8a6420,var(--gold));box-shadow:0 0 60px var(--glow);margin:18px 0 8px}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 25%;border:4px solid #070c1c;display:block}
#hero h2{font-size:clamp(1.4rem,5.6vw,2.1rem);letter-spacing:.08em;font-weight:700;text-shadow:0 0 12px rgba(232,185,96,.5);animation:glow-pulse 4s ease-in-out infinite}
.name{font:600 clamp(3.4rem,17vw,6.6rem)/1.1 'Dancing Script','Caveat',cursive;padding:.15em .1em;filter:drop-shadow(0 0 22px var(--glow));animation:glow-pulse 5s ease-in-out infinite float 4s ease-in-out infinite}
.date{color:var(--dim);letter-spacing:.3em;font-size:.8rem;font-family:'Caveat','Dancing Script',cursive;font-weight:600}
.hint{position:absolute;bottom:22px;color:var(--dim);font-size:.8rem;animation:bob 2.4s infinite;font-family:'Inter','Poppins',sans-serif}
/* wish */
.wish{max-width:620px;padding:42px 28px;border-radius:26px;background:rgba(247,236,214,.045);border:1px solid rgba(232,185,96,.25);box-shadow:0 0 60px rgba(232,185,96,.08)}
.wish p{font:400 clamp(1.2rem,4.4vw,1.5rem)/1.75 'Inter','Poppins',sans-serif;margin-bottom:.9em}
.wish p:last-child{margin:0;color:var(--gold2)}
/* gallery */
h2.t{font-size:clamp(2rem,8vw,2.8rem);margin-bottom:6px;font-family:'Caveat','Dancing Script',cursive;font-weight:700;text-shadow:0 0 10px rgba(232,185,96,.4)}
.sub{color:var(--dim);font-size:.9rem;margin-bottom:26px;letter-spacing:.5px;font-family:'Inter','Poppins',sans-serif}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;padding:10px calc(50vw - min(37vw,170px)) 24px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.sl{flex:0 0 min(74vw,340px);scroll-snap-align:center;background:#0c1328;border:1px solid rgba(232,185,96,.25);border-radius:24px;padding:10px 10px 16px;box-shadow:0 18px 40px rgba(0,0,0,.7),0 0 26px rgba(232,185,96,.07)}
.sl img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 20%;border-radius:16px;display:block;transition:transform .8s cubic-bezier(.25,.4,.25,1),box-shadow .8s ease}
.sl:hover img{transform:scale(1.05);box-shadow:0 0 30px rgba(232,185,96,.4),0 0 50px rgba(255,107,138,.3)}
.sl p{font:500 1.25rem 'Inter','Poppins',sans-serif;color:var(--gold2);margin-top:12px}
.nav{display:flex;gap:14px;margin-top:6px}
.nav button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(232,185,96,.5);background:transparent;color:var(--gold2);font-size:1.2rem;cursor:pointer}
/* cake */
.cake{position:relative;width:230px;height:200px;margin:24px auto 34px;filter:drop-shadow(0 0 40px rgba(232,185,96,.25));animation:glow-pulse 6s ease-in-out infinite}
.k{position:absolute;border-radius:14px}
.k1{bottom:0;left:0;right:0;height:70px;background:linear-gradient(#f6dc9b,#d9a550);overflow:hidden}
.k1::after{content:"";position:absolute;top:0;left:0;right:0;height:22px;background:#7a1523;border-radius:0 0 50% 50%/0 0 100% 100%}
.k2{bottom:70px;left:25px;right:25px;height:58px;background:linear-gradient(#fff4dd,#e8c98a);overflow:hidden}
.k2::after{content:"";position:absolute;top:0;left:0;right:0;height:18px;background:#7a1523;border-radius:0 0 50% 50%/0 0 100% 100%}
.cd{position:absolute;bottom:128px;width:8px;height:38px;border-radius:3px;background:repeating-linear-gradient(45deg,#fff 0 6px,var(--gold) 6px 12px)}
.fl{position:absolute;bottom:166px;width:14px;height:24px;margin-left:-3px;background:radial-gradient(ellipse at 50% 70%,#fff8d6,#ffb938 60%,transparent 72%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;box-shadow:0 0 22px 8px rgba(255,185,56,.6);transform-origin:50% 100%;animation:fk .35s ease-in-out infinite alternate;transition:opacity .5s,transform .5s}
@keyframes fk{to{transform:scale(1.12,.92) rotate(4deg)}}
.off .fl{animation:none;opacity:0;transform:scale(.2)}
.sm{position:absolute;bottom:170px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);opacity:0}
.off .sm{animation:sm 2.2s ease-out}
@keyframes sm{from{opacity:.7}to{opacity:0;transform:translateY(-70px) scale(4)}}
.wm{min-height:2em;margin-top:22px;font:500 1.4rem 'Caveat','Dancing Script',cursive;color:var(--gold2);opacity:0;transition:opacity 1s;filter:drop-shadow(0 0 15px rgba(232,185,96,.3))}
.wm.on{opacity:1}
/* final */
#final p.m{font:500 clamp(1.6rem,6vw,2.4rem)/1.5 'Inter','Poppins',sans-serif;max-width:15em}
.big{font:600 clamp(2.6rem,12vw,4.6rem) 'Dancing Script',cursive;margin-top:18px;animation:glow-pulse 4s ease-in-out infinite}
.from{color:var(--dim);margin-top:26px}
.from b{display:block;font:600 clamp(2.2rem,9vw,3rem)/2 'Caveat','Dancing Script',cursive;color:var(--gold2)}
#music{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:60;display:none;gap:8px}
#music.show{display:flex}
#music button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(232,185,96,.5);background:rgba(10,8,4,.7);backdrop-filter:blur(8px);color:var(--gold2);font-size:1.1rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.rv{opacity:1;transform:none}}

/* romantic overlay + twinkling stars */
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 30% 30%,rgba(232,185,96,.04) 0,transparent 50%),radial-gradient(circle at 70% 70%,rgba(255,107,138,.03) 0,transparent 50%);pointer-events:none;z-index:1;mix-blend-mode:screen}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.8}
.star{width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 6px rgba(255,255,255,.9),0 0 12px rgba(232,185,96,.6),0 0 20px rgba(255,107,138,.4);animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.glow{animation:glow-pulse 3s ease-in-out infinite}
@keyframes glow-pulse{0%,100%{filter:brightness(1) drop-shadow(0 0 10px rgba(232,185,96,.3))}50%{filter:brightness(1.2) drop-shadow(0 0 20px rgba(255,107,138,.5),0 0 30px rgba(232,185,96,.4))}}
.smooth{transition:all 1s cubic-bezier(.25,.4,.25,1)!important}
/* smoother spark animation */
.sp{animation:tw 5s cubic-bezier(.25,.1,.25,1) infinite}
@keyframes shine{0%,100%{background-position:0% center}50%{background-position:100% center}}
</style>
</head>
<body>
<canvas id="fx"></canvas><div id="bg"></div>
<div id="music"><button id="pp" aria-label="Play or pause music">♪</button><button id="mu" aria-label="Mute or unmute">🔊</button></div>
<div class="stars" id="stars"></div>

<section id="welcome">
  <div class="gift" aria-hidden="true"><div class="b"></div><div class="l"></div><div class="r"></div></div>
  <h1 class="gold" id="wt"></h1>
  <button class="btn glow" id="open">Open Your Surprise 🎁
</section>

<main hidden>
  <section id="hero">
    <h2 class="gold rv">HAPPY BIRTHDAY, ESHAAL! 🎂</h2>
    <div class="ring rv"><img id="hi" alt="Eshaal"></div>
    <div class="name gold rv" id="nm"></div>
    <div class="date rv" id="dt"></div>
    <button class="btn nx rv">Read My Wish 💌</button>
  </section>
  <section><div class="wish rv" id="wish"></div><button class="btn nx rv">See Our Memories 📸</button></section>
  <section>
    <h2 class="t gold rv">Memories</h2>
    <div class="sub rv">swipe →</div>
    <div class="rail rv" id="rail"></div>
    <div class="nav"><button id="pv" aria-label="Previous photo">‹</button><button id="nx" aria-label="Next photo">›</button></div>
    <button class="btn nx rv">Next: Your Cake 🎂</button>
  </section>
  <section>
    <h2 class="t gold rv">Make a Wish</h2>
    <div class="cake rv" id="ck" aria-hidden="true"><div class="k k1"></div><div class="k k2"></div></div>
    <button class="btn" id="wb">Make a Wish ✨</button>
    <div class="wm" id="wm"></div>
    <button class="btn nx" id="cn" hidden>One Last Thing 💫</button>
  </section>
  <section id="final">
    <p class="m rv" id="fin"></p>
    <div class="big gold rv">Happy Birthday, Eshaal!</div>
    <div class="from rv glow">All my love,<b id="by"></b></div>
  </section>
</main>

const $ = id => document.getElementById(id);
$('wt').textContent = C.welcome; $('nm').textContent = C.name; $('dt').textContent = C.date;
$('fin').textContent = C.final; $('by').textContent = C.from; $('hi').src = IMGS[C.hero];
$('nm').dir = $('by').dir = 'rtl'; $('nm').lang = $('by').lang = 'ur';
C.wish.forEach(t => { const p = document.createElement('p'); p.textContent = t; $('wish').appendChild(p); });
C.gallery.forEach(([i, cap]) => { const d = document.createElement('figure'); d.className = 'sl';
  const im = new Image(); im.src = IMGS[i]; im.alt = cap; im.loading = 'lazy'; const p = document.createElement('p'); p.textContent = cap; d.append(im, p); $('rail').appendChild(d); });
const step = d => $('rail').scrollBy({ left: d * Math.min(innerWidth * .74, 340) + 18, behavior: 'smooth' });
$('pv').onclick = () => step(-1); $('nx').onclick = () => step(1);

const bg = $('bg');
for (let i = 0; i < 60; i++) { const s = document.createElement('i'); s.className = 'sp';
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*5}s;animation-duration:${4+Math.random()*4}s;width:2px;height:2px`; bg.appendChild(s); }

/* twinkling stars */
const stars = $('stars');
const colors = ['#e8b960','#ff8fa3','#fff3cf','#a8edea','#74b9ff','#fd79a8'];
for (let i = 0; i < 120; i++) { const s = document.createElement('div'); s.className = 'star';
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s;animation-duration:${3+Math.random()*3}s;background:${colors[Math.floor(Math.random()*colors.length)]}`; stars.appendChild(s); }

/* confetti */
const cv = $('fx'), cx = cv.getContext('2d'); let ps = [], run = false;
const fit = () => { cv.width = innerWidth; cv.height = innerHeight; }; fit(); addEventListener('resize', fit);
const cols = ['#e8b960','#f6dc9b','#fff3cf','#ff8fa3','#f7ecd6','#c0392b','#ff6b8b','#ff9a8b','#c9659b','#a8edea','#74b9ff','#fd79a8'];
function burst(x, y, n = 160) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 6 + Math.random() * 11;
    const sz = 3 + Math.random() * 6;
    ps.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, w: sz, h: sz, r: 0, vr: (Math.random() - .5) * .5, c: cols[Math.floor(Math.random() * cols.length)], l: 120 + Math.random() * 80, g: 0.5 + Math.random() * 0.5}); }
  if (!run) { run = true; requestAnimationFrame(loop); } }
function loop() { cx.clearRect(0, 0, cv.width, cv.height); ps = ps.filter(p => p.l-- > 0 && p.y < cv.height + 30);
  ps.forEach(p => { p.vy += .18; p.vx *= .985; p.g *= 0.98; p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.globalAlpha = Math.min(1, p.l / 50 * p.g); cx.fillStyle = p.c; cx.shadowColor = p.c; cx.shadowBlur = 8; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
  ps.length ? requestAnimationFrame(loop) : (run = false); }
const rain = () => { const t = setInterval(() => burst(Math.random() * innerWidth, -10, 22), 180); setTimeout(() => clearInterval(t), 4000); };
const sparkle = () => { const t = setInterval(() => burst(innerWidth * (0.2+Math.random()*0.6), innerHeight * (0.15+Math.random()*0.5), 8), 400); setTimeout(() => clearInterval(t), 5000); };

/* quiet synthesized birthday melody */
let ac, mg, on = false, mute = false, ix = 0, tm; const VOL = .09;
const N = [[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,2],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2],[0,2]];
function note() { if (!on) return; const [f, b] = N[ix++ % N.length], d = b * .55;
  if (f) { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .03); g.gain.exponentialRampToValueAtTime(.001, t + d + .5);
    o.connect(g); g.connect(mg); o.start(t); o.stop(t + d + .6); }
  tm = setTimeout(note, d * 1000); }
function play(v) { on = v; $('pp').textContent = v ? '❚❚' : '♪'; clearTimeout(tm); if (v) { if (ac.state === 'suspended') ac.resume(); note(); } }
function music() { try { ac = new (window.AudioContext || window.webkitAudioContext)(); mg = ac.createGain(); mg.gain.value = VOL; mg.connect(ac.destination); $('music').classList.add('show'); play(true); } catch (e) {} }
$('pp').onclick = () => ac && play(!on);
$('mu').onclick = () => { mute = !mute; if (mg) mg.gain.value = mute ? 0 : VOL; $('mu').textContent = mute ? '🔇' : '🔊'; };

const pgs = [...document.querySelectorAll('main section')]; let cur = -1;
function go(n) { if (cur >= 0) pgs[cur].classList.remove('on'); cur = n; const p = pgs[n]; p.classList.add('on'); scrollTo(0, 0);
  p.querySelectorAll('.rv').forEach((el, i) => el.style.animationDelay = i * .22 + 's');
  burst(innerWidth / 2 + (Math.random() - .5) * 200, innerHeight / 2 + (Math.random() - .5) * 100, 40); }
document.querySelectorAll('.nx').forEach(b => b.onclick = () => { go(cur + 1); if (cur === pgs.length - 1) { burst(innerWidth / 2, innerHeight / 3, 160); setTimeout(sparkle, 300); } });
let ambient;
$('open').onclick = () => { $('welcome').classList.add('go'); music();
  setTimeout(() => { $('welcome').style.display = 'none'; document.querySelector('main').hidden = false; go(0); burst(innerWidth / 2, innerHeight / 3, 200); rain(); setTimeout(sparkle, 500);
    ambient = setInterval(() => { burst(innerWidth * (0.15+Math.random()*0.7), innerHeight * (0.1+Math.random()*0.4), 5); }, 1200); }, 800); };

const ck = $('ck');
[70, 108, 146].forEach(x => { ['cd','fl','sm'].forEach(c => { const e = document.createElement('div'); e.className = c; e.style.left = x + 'px'; ck.appendChild(e); }); });
let off = false;
$('wb').onclick = () => { const r = $('wb').getBoundingClientRect(); off = !off; ck.classList.toggle('off', off);
  $('wm').textContent = off ? C.after : ''; $('wm').classList.toggle('on', off); $('wb').textContent = off ? 'Light the Candles Again 🕯️' : 'Make a Wish ✨';
  if (off) { burst(innerWidth / 2, r.top - 80, 150); rain(); setTimeout(sparkle, 300); $('cn').hidden = false; } };
</script>
